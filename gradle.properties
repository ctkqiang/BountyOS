# JVM memory and encoding for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is mandatory for this project (Jetpack Compose, Room, WorkManager).
android.useAndroidX=true

# Non-transitive R classes keep resource access scoped to the module that owns it.
android.nonTransitiveRClass=true

# Use the official Kotlin coding style.
kotlin.code.style=official

# Google Play 要求新应用与更新以 API 36 为目标，故 compileSdk 提升到 36。
# 当前 AGP 版本尚未正式声明支持 36，此标记仅抑制相应告警，不影响产物。
android.suppressUnsupportedCompileSdk=36
