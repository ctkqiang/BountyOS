# JVM memory and encoding for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is mandatory for this project (Jetpack Compose, Room, WorkManager).
android.useAndroidX=true

# Non-transitive R classes keep resource access scoped to the module that owns it.
android.nonTransitiveRClass=true

# Use the official Kotlin coding style.
kotlin.code.style=official
