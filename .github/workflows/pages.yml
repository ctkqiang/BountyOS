name: Deploy GitHub Pages

# 仅在手动触发。仓库当前使用「Deploy from a branch」方式发布 Pages
# （Settings -> Pages -> Source: main / docs），该方式无需 Actions 参与。
# 若日后改为「GitHub Actions」发布源，可手动运行本工作流。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement 默认开启：若仓库尚未启用 Pages，这一步会尝试自动启用。
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
